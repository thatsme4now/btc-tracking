<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bitcoin Portfolio — Import</title>
    <link rel="icon" type="image/x-icon"  th:href="@{/favicon.ico}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32.png}"/>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}"/>
    <link rel="stylesheet" th:href="@{/vendor/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/vendor/css/bootstrap-icons.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/depot.css}"/>
</head>
<body class="depot-body">

<div th:replace="~{depot/fragments/navbar :: navbar(false, '')}"></div>

<main class="container-fluid px-4 py-4">

    <div id="statusToast" class="depot-toast d-none"></div>

    <div class="import-wizard-steps mb-3">
        <span class="import-wizard-step done">1. <span data-i18n="import.step.mapping">Zuordnung</span></span>
        <span class="import-wizard-step-sep">→</span>
        <span class="import-wizard-step done">2. <span data-i18n="import.step.review">Prüfen</span></span>
        <span class="import-wizard-step-sep">→</span>
        <span class="import-wizard-step active">3. <span data-i18n="import.step.status">Status</span></span>
    </div>

    <div class="depot-card mb-3">
        <div class="depot-card-header" id="statusHeadline"></div>
        <p id="statusFallbackNote" class="d-none" style="font-size:.75rem;color:var(--text-muted);margin-top:.5rem" data-i18n="import.status.fallbackNote">
            Detaildaten zu diesem Import sind nicht mehr verfügbar (Seite neu geladen) — hier nur die gespeicherten Kennzahlen.
        </p>

        <div class="row g-3 mt-1" id="statusMetrics"></div>
    </div>

    <div class="depot-card d-none" id="statusErrorsCard">
        <div class="depot-card-header" data-i18n="import.status.errors.title">Zeilen mit Problemen</div>
        <div class="table-responsive">
            <table class="table depot-table mb-0">
                <thead>
                <tr>
                    <th data-i18n="table.col.date">Datum</th>
                    <th data-i18n="table.wallets">Wallet/Börse</th>
                    <th data-i18n="table.col.type">Typ</th>
                    <th data-i18n="import.status.errors.reason">Grund</th>
                </tr>
                </thead>
                <tbody id="statusErrorsBody"></tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
        <a href="/btc-tracking" class="btn depot-btn-primary">
            <i class="bi bi-database me-1"></i><span data-i18n="import.status.backToOverview">Zur Datenverwaltung</span>
        </a>
    </div>

</main>

<div th:replace="~{depot/fragments/navbar-modals :: navbarModals}"></div>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/vendor/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/i18n.js}"></script>
<script th:src="@{/js/currency.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/applock.js}"></script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/import-common.js}"></script>
<script th:src="@{/js/import-status.js}"></script>
</body>
</html>
